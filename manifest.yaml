# ============================================================
# 交接清单 Manifest 模板
# 黄山派嵌入式产品开发实验课程 · Agent协作开发与评审机制
#
# 用途：Dev Agent（学生侧）按此schema生成提交材料，
#       Eval Agent（教师侧）按此schema解析并评审。
# 使用方法：复制本文件为 submission_<学号或组号>_<里程碑>.yaml，
#          按字段填写；带 <> 的地方替换成实际内容。
# 重要：本文件中除 dev_agent.model / dev_agent.tool 等元信息栏位外，
#      其余内容应尽量由agent在开发过程中自动生成/追加，
#      而不是学生在提交前手写编造——手写内容的可信度视同人工记录，
#      不享有"agent执行留痕"的免核验优先级。
# ============================================================

submission:
  student_id: "<学号，例如 S2026001>"
  student_name: "<姓名>"
  group_id: "<组别，例如 G3>"
  milestone: "<里程碑名称，例如 阶段4-AI语音集成 / Capstone-检查点2 / Capstone-终版>"
  submitted_at: "<ISO时间戳，例如 2026-11-03T21:40:00+08:00>"

dev_agent:
  tool: "<使用的agent工具，例如 Claude Code>"
  model: "<模型版本，例如 claude-sonnet-5，请据实填写，不要凭记忆猜测>"
  session_log_path: "<完整会话记录文件路径，必须是原始导出，不可编辑>"
  session_log_hash: "<可选：会话记录文件的哈希值，用于防止事后篡改>"

requirements:
  prd_path: "<需求规格说明路径，默认 docs/01-需求规格说明.md>"
  hardware_constraints_ref: "<引用的硬件规格文档，例如黄山派硬件手册链接或本地副本路径>"

design:
  architecture_doc_path: "<方案设计说明路径，默认 docs/02-方案设计说明.md>"
  key_decisions:
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "<例如：选择BLE而非WiFi做数据同步>"
      alternatives_considered: "<例如：曾考虑过用SD卡离线导出，因为使用场景需要实时同步而放弃>"
      rationale: "<为什么最终这么选，写具体理由，不要只写'效果更好'>"
      decided_by: "<agent建议+学生确认 / 学生主导 / 纯agent自动决定（不建议用于关键决策）>"

code:
  repo_url: "<git仓库地址>"
  commit_range: "<起始commit..结束commit，对应本次里程碑>"

physical_verification:
  # 每一个物理验证节点都要有对应记录，节点类型见配套文档《Agent协作开发与评审机制》第三节表格
  - item: "REQ-001 / TC-001：v0.1.1首次启动文字片段"
    required_action: "用户下载当前修改版并回传真实启动输出，核对版本与练习文字；具体复位方式未包含在首段原文中。"
    executed_at: null # 用户片段只有RX时间10:46:27，没有含日期的完整操作时间戳。
    evidence_received_at: "2026-10-22"
    evidence_path: "evidence/week03/boot_20261022_user_excerpt.txt"
    agent_conclusion: "首段版本和练习文字各一次，结合随后取得的第二次复位记录，按原始启动文字判据判TC-001通过。原文缺完整启动边界和green/blue，不宣称全部采集步骤完整或长期稳定。"
  - item: "下载完成和RGB轮换：用户实物反馈"
    required_action: "用户完成Download后观察板卡，反馈实际运行现象。"
    executed_at: null # 用户没有提供下载操作的完整时间戳。
    evidence_received_at: "2026-10-22"
    evidence_path: "evidence/week03/flash_rgb_20261022_user_report.txt"
    agent_conclusion: "用户确认下载成功和LED轮换；未附CodeKit完整输出，不补造工具退出码或写入校验。该反馈不代替两次启动日志。"
  - item: "REQ-001 / TC-002：发送reboot后的第二次启动"
    required_action: "用户在1000000波特率监视器发送reboot并回传第二次启动输出。"
    executed_at: null # 原文仅有时刻标签，未包含操作日期。
    evidence_received_at: "2026-10-22"
    observed_time_labels: "TX reboot 10:54:07；启动RX 10:54:09"
    evidence_path: "evidence/week03/reboot_20261022_user_transcript.txt"
    agent_conclusion: "发送reboot后出现SFBL和启动输出，第二次启动片段中v0.1.1与新练习文字各一次，TC-002启动文字判据通过；仅有red，无完整green/blue辅助记录，不扩展为其他外设或长期稳定性通过。"
  - item: "REQ-002 / TC-003：v0.1.2屏幕文字实物照片"
    required_action: "用户下载屏幕版并观察实际屏幕，回传真实照片。"
    executed_at: null # 用户未提供拍摄/下载的完整时间戳。
    evidence_received_at: "2026-10-22"
    evidence_path: "evidence/week03/screen_20261022_user_photo.jpg"
    evidence_note_path: "evidence/week03/screen_20261022_user_photo_record.md"
    evidence_sha256: "578E49715C4467418AE0F8E463AC59E76351047194075F21448547771EAEB5DF"
    agent_conclusion: "实物照片可见屏幕已点亮，course_starter、v0.1.2及完整练习文字均可辨认，无可见截断。屏幕显示子项确认；TC-003本版串口/RGB/刷屏反馈及TC-004复位仍待补，不扩大为整项通过。"
  - item: "REQ-002 / TC-003、TC-004：v0.1.2复位启动与RGB反馈"
    required_action: "用户发送reboot并回传本版启动日志，反馈RGB是否轮换、颜色日志是否停止刷屏。"
    executed_at: null # 原文只有时间标签，没有含日期的完整操作时间戳。
    evidence_received_at: "2026-10-22"
    observed_time_labels: "SFBL 16:43:19；应用与显示启动16:43:21"
    evidence_path: "evidence/week03/reboot_164319_20261022_user_transcript.txt"
    evidence_note_path: "evidence/week03/reboot_164319_20261022_analysis.md"
    agent_conclusion: "复位后v0.1.2、练习文字、390x450界面创建及显示ON均有日志；用户确认RGB仍轮换且停止刷屏。结合此前实物照片，TC-003通过；TC-004仅复位/启动已确认，实际复位后画面尚待确认，不据初始化日志直接记屏幕通过。"

test_results:
  - test_id: "TC-001"
    description: "REQ-001 / v0.1.1首次真实启动验证（历史已实测）"
    expected: "同次启动包含v0.1.1 boot ok和新练习文字，练习文字本次启动仅一次；记录是否有异常。"
    actual: "用户RX 10:46:27片段中版本及练习文字各一次，并有red；用户另确认下载成功、LED轮换。源码启动打印在循环前。未见所给片段内新增应用错误；启动边界与green/blue辅助记录不完整，详见测试报告。"
    status: "passed"
    pass: true # 仅原测试计划的启动文字判据；不代表辅助采集步骤完整或整体交接完成。
    evidence_path: "evidence/week03/boot_20261022_user_excerpt.txt"
  - test_id: "TC-002"
    description: "REQ-001 / v0.1.1再次复位启动验证（历史已实测）"
    expected: "再次复位后仍出现相同版本和练习文字，本次启动练习文字仅一次。"
    actual: "TX 10:54:07发送reboot，随后SFBL与RX 10:54:09启动输出；第二次启动片段内版本和练习文字各一次，随后red。复位前red单独排除，不计入本次启动。未见所给片段内新增应用错误；无green/blue完整辅助记录。"
    status: "passed"
    pass: true
    evidence_path: "evidence/week03/reboot_20261022_user_transcript.txt"

  - test_id: "TC-003"
    description: "REQ-002 / v0.1.2首次屏幕与启动验证"
    expected: "屏幕完整显示course_starter、v0.1.2与练习文字；串口版本对应；RGB轮换且颜色日志不再刷屏，异常原文保留。"
    actual: "此前实物照片显示完整项目名、v0.1.2及练习文字；本次16:43复位日志包含相同版本和文字、UI创建及显示ON，用户明确反馈RGB仍轮换且已停止刷屏。两份证据在不同启动时刻取得，不伪装成同一时刻。"
    status: "passed"
    pass: true
    evidence_path: "evidence/week03/reboot_164319_20261022_analysis.md"
    supporting_evidence_paths:
      - "evidence/week03/screen_20261022_user_photo.jpg"
      - "evidence/week03/reboot_164319_20261022_user_transcript.txt"
  - test_id: "TC-004"
    description: "REQ-002 / v0.1.2再次复位屏幕验证"
    expected: "再次复位后屏幕完整显示相同项目名、v0.1.2和练习文字，串口版本对应，记录异常。"
    actual: "已取得16:43:19 reboot/SFBL到16:43:21新版启动、UI创建及显示ON日志。复位已执行；复位后实际画面尚需用户明确确认或照片，不以驱动日志替代。"
    status: "in_progress"
    pass: null
    evidence_path: "evidence/week03/reboot_164319_20261022_user_transcript.txt"

known_issues:
  - "v0.1.1两项串口用例与v0.1.2的TC-003已实测通过；TC-004复位启动已执行，复位后实际画面待用户确认。图形运行时内存与长期稳定性未测。"
  - "screen_host_preview_20261022.png是实际UI源码的软件渲染，不是实物照片；初始化创建日志不代表屏幕已经显示。"
  - "身份、原始会话导出及本人解释等交接材料仍未齐全；未知操作时间戳保持空值。"

self_review: |
  <agent生成的自我复盘，包括：本次里程碑完成度如何、哪些地方agent自己也不确定、
  哪些决策是在学生介入/纠正之后才修改的。建议由agent在里程碑结束时自动生成，
  不建议学生代写。>

human_checkpoints:
  # 用于区分"学生自己做的决定"和"agent建议、学生只是同意"
  - decision_point: "<例如：是否采用非线性PWM映射>"
    student_confirmation: "<学生对该决策的确认说明，最好包含'为什么认可/为什么修改'的具体理由>"

