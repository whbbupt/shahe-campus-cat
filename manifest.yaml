  此前个人练习已有真实构建、用户板卡照片、启动日志、RGB反馈、复位后画面明确确认和本人解释。
  当前T1 v0.2.0已编译并收到真实启动/自检、9条按键原文、用户10次成功确认及视频；TC-005/008通过，缺第10条原始串口，TC-006已按25次日志及额外30次正常用户确认通过，后24次原文未复制，风险及采集差异保留。
  v0.1.1两项串口历史及v0.1.2两项屏幕相关用例在各自范围通过；不是17项外设全过或正式产品完成。
  AI最初只安排串口，用户指出应显示在屏幕后按手册补齐；用户也纠正了把bat当必做步骤的冗余操作。
  新增LVGL首次漏配MEMHEAP导致构建失败，保留失败并补配置重建，主机预览失败过程同样保留。
  用户亲自负责下载、观察、复位和证据，并说明在main修改版本/文字、通过屏幕确认；没有把AI源码记为学生独立手写。
  未取得第二张复位照片、原始完整下载输出、操作日期与运行时内存/稳定性数据，限制如实保留。
  收尾仅本地提交和个人练习归档，不推送、不处理小智或替用户选产品。最终产品级交接字段仍有真实缺口。

