design:
  architecture_doc_path: "docs/02-方案设计说明.md"
  key_decisions:
    - decision: "校园地图保留现有道路底图叠加建筑名/施工黄条；活动中心弹窗；餐厅窗口标签；勤工俭学/跳舞/羽毛球即时交互"
      alternatives_considered: "A 保留底图+弹窗/标签+即时交互；B 重绘扁平地图+新场景+独立餐厅楼；C 只做活动中心弹窗"
      rationale: "A 兼容旧档/旧测试，最快上板；B 视觉更贴近示意图但重做门位/场景/存档风险大；用户四选一确认A"
      decided_by: "王焕博（四选一确认，ADR-0021）"
    - decision: "图鉴采用3×4一屏网格，上两行食堂/下两行外卖"
      alternatives_considered: "12行滚动列表；2×6紧凑列表；分页每页4项"
      rationale: "12项一屏看全、接近Catbook收藏感；代价是去掉每项来源第二行，用分区与底注表达"
      decided_by: "用户要求聚焦项目设计；agent据实际LVGL预览提出，ADR-0020"
    - decision: "校园图鉴复用64字节存档的保留字节r[5]/r[7]，存档格式升到11"
      alternatives_considered: "新增独立图鉴分区；记录扩到128字节；只在本次开机记录"
      rationale: "12位刚好两个字节，不改分区、记录大小和轮转；旧1–10可读且图鉴视为空，旧10遇11保护"
      decided_by: "用户选择图鉴方向；备选权衡由AI完成，ADR-0019"
    - decision: "撤集中商店，保留金币并在食堂/宿舍分别点单，宵禁保留室内生活"
      alternatives_considered: "保留金币场景点单；取消金币改免费生活互动"
      rationale: "用户选择前者并确认范围，后续明确先坐下弹滑动菜单、菜品图片和数值平衡；复用固定位置布置"
      decided_by: "王焕博明确选择与确认；ADR-0018，具体菜价和数值为AI实施初稿"
    - decision: "小游戏赚金币购买食物与固定位置宿舍布置，替代手账主目标"
      alternatives_considered: "固定位置永久拥有并免费切换；自由拖拽布置需动态避障和编辑流程"
      rationale: "用户认为手账用途有限，要求赚生活费；先建立赚钱消费保存闭环"
      decided_by: "用户明确授权更换，并选择固定位置换款式；ADR-0017"
    - decision: "iPhone原生CTS连接后自动校时，保留0004备用"
      alternatives_considered: "设备读取原生CTS；独立iOS App自动写0004；继续手工编码"
      rationale: "用户不希望手写时间，同意优先利用系统服务，省去单独手机工程；实际兼容性需板测"
      decided_by: "用户明确回复可以；ADR-0016"
    - decision: "现实24小时作息，手机主动发送时间校准设备RTC"
      alternatives_considered: "现实时间作息并手机校时；30分钟游戏一天并另显示现实钟；先不改时间只做蓝牙和音量"
      rationale: "iPhone数据通道验证后用户明确选择现实作息；日历与业务运行时长分离，离线不追罚"
      decided_by: "用户最新明确选择；ADR-0015，2026-11-08登记"
    - decision: "历史ADR-0014：48倍校园日程，日历方向已被ADR-0015替代"
      alternatives_considered: "15/30/60分钟一日；关机暂停/离线继续；仅提醒/严格开放/保留替代活动"
      rationale: "用户明确选择30分钟一日、开机续玩、按时段保留替代活动；保存布局原待评审；最新现实时间决定见ADR-0015"
      decided_by: "用户三次明确选择；具体参数AI拟定，ADR-0014"
    - decision: "短音效加循环背景音乐"
      alternatives_considered: "仅互动短音效；短音效与循环背景音乐"
      rationale: "用户明确选择同时加入，离线素材混音并提供三种声音模式"
      decided_by: "用户选择范围；旋律和模式参数由AI设计，ADR-0013"
    - decision: "养成为主，穿插可选短小游戏"
      alternatives_considered: "小游戏挑战主导；校园照料与收集主导、穿插小游戏"
      rationale: "手账记录已有照料活动，记忆题提供短暂变化，没有每日惩罚"
      decided_by: "用户明确选择主次；具体玩法参数由AI设置，ADR-0012"
    - decision: "连续校园地图＋跟随镜头，建筑门口衔接室内"
      alternatives_considered: "分屏道路探索；连续地图与跟随镜头"
      rationale: "用户明确选择连续地图，要求从教室沿路走到十字路口探索，取消生产目的地传送菜单；矢量地图与有界路网由AI实施"
      decided_by: "王焕博；ADR-0007，evidence/pet/campus_exploration_choice_20261028_user.txt"
    # 每一条关键决策都要写清楚：决策内容 / 考虑过的备选方案 / 选择理由 / 谁做的最终决定
    - decision: "本次个人练习补齐板载屏幕文字，保留已实测串口历史"
      alternatives_considered: "先前只保留串口最小修改；根据用户纠正与手册要求补最小屏幕页"
      rationale: "手册第7页环境闭环要求屏幕文字，串口修改不能代替；沿用课程既定LVGL v9，无新增产品方向或硬件选型"
      decided_by: "用户指出应该显示在屏幕并要求处理屏幕不亮，AI据此纠正练习范围；具体实现由AI协助"

    - decision: "T1周期轮询读取KEY1；每次采样后等待5ms"
      alternatives_considered: "A周期轮询线程；B GPIO中断通知主线程"
      rationale: "用户选择便于理解和调试的轮询；按键事件经队列交主线程，沿用KEY1原配置；首版不加消抖"
      decided_by: "王焕博（用户明确选择；原话见evidence/T1/polling_choice_20261022_user.txt）"

    - decision: "正式产品采用电子宠物方向，两人团队；首版范围尚待确认"
      alternatives_considered: "体感迷宫、电子宠物、桌面状态牌；用户也可自主命题"
      rationale: "用户明确选择喂食互动、状态变化、动画反馈；个人选择理由未补充，范围和架构不代为决定"
      decided_by: "王焕博（用户原话见evidence/pet/product_direction_20261023_user.txt；ADR-0002）"

    - decision: "电子宠物v0.3.0默认离线、单线程独占模型，纯C规则与LVGL分离"
      alternatives_considered: "UI主线程持有短小模型；独立业务线程加队列。首版会话版对比直接加入存档/联网"
      rationale: "用户授权列出后直接开始；当前无耗时I/O，先建立可验证闭环，存档预研和联网拓展不虚报完成"
      decided_by: "用户授权后AI建议采用；见ADR-0003与implementation_authorization_20261023_user.txt"

    - decision: "沙河校园采用三场景及模型驱动的上课/吃饭/休息"
      alternatives_considered: "仅换背景保留原规则；增加校园行为与数值变化"
      rationale: "用户明确选择校园行为版本和沙河；保留单线程，切场景与结算分离；具体演示参数由AI提出"
      decided_by: "王焕博选择范围；见ADR-0004与campus_scope_20261025_user.txt"


    - decision: "固定房间网页方案实际移植为纯C世界模型与LVGL快照界面"
      alternatives_considered: "UI回调/动画直接结算；纯C模型持有路径、意图、时钟与结算"
      rationale: "延续ADR-0003单所有者，支持到达复核/途中重选/共享自检，防止重复结算；资源编入ROM，字体来自SDK的OFL源"
      decided_by: "用户明确ok你更改吧授权移植；常规技术实现由AI沿用既有边界完成，见ADR-0005及scene_port_authorization_20261026_user.txt"

    - decision: "专用Flash双份校验追加式宠物存档"
      alternatives_considered: "A专用区域双份校验；B文件系统存档"
      rationale: "小快照无需文件系统；专用区域避开dfu/ble/fs，提交前保留旧记录，固定输入可测中断恢复"
      decided_by: "用户明确选择A，见ADR-0006及evidence/pet/save_choice_20261028_user.txt"

    - decision: "分块地面和独立景物的精致插画校园样板"
      alternatives_considered: "矢量、整幅大图、分层图片、规则图块；插画与像素风对照"
      rationale: "用户选择第三种和左侧插画，认可先做教学楼前＋路口；沿用C/LVGL和室内猫，实机另验"
      decided_by: "王焕博选择路线/画风/样板范围；具体工程参数AI提出，ADR-0008"

    - decision: "沙河校园先完成三室内与核心道路"
      alternatives_considered: "先完成全校铺图；先验证可完整往返的生活路线"
      rationale: "先验证共用走法、实体门和可玩的首批闭环，再扩完整校园"
      decided_by: "用户明确指定首批范围，AI据校图落实坐标与素材，见ADR-0009"

    - decision: "保留饱食与心情两项并重平衡"
      alternatives_considered: "保留双数值重平衡；新增精力；仅改数值显示"
      rationale: "保留现有兼容结构，活动体现不同的消耗和恢复"
      decided_by: "用户明确选择保留两项，详见 ADR-0010"

    - decision: "外卖与饱食原子保存，健身房与新冷却沿用现有双区"
      alternatives_considered: "只在会话保存；复用双区日志扩展版本"
      rationale: "保存后可复位续取，避免订单与饱食拆开恢复"
      decided_by: "用户同意功能计划，AI据已确认方向设计，见 ADR-0011"

