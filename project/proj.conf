CONFIG_BSP_PWMT2_UPDATE_USING_DMA=y
CONFIG_RGB_SK6812MINI_HS_ENABLE=y
CONFIG_RGB_USING_SK6812MINI_HS_PWM_DEV_NAME="pwmt2"
CONFIG_BSP_USING_RGBLED_CH=1

# SDK lvgl_v9_demos: the UI main thread needs more than the 2 KB starter stack.
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
# PCM feeder (priority 18) runs before UI rendering, as in peripheral_lab.
CONFIG_RT_MAIN_THREAD_PRIORITY=19
# Required by the SDK LVGL app_mem.c allocator, as in lvgl_v9_demos.
CONFIG_RT_USING_MEMHEAP=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# SDK middleware/audio/Kconfig: local PCM through the board Codec/PA.
CONFIG_AUDIO=y
CONFIG_AUDIO_USING_MANAGER=y
CONFIG_AUDIO_USING_AUDPROC=y
CONFIG_AUDIO_SPEAKER_USING_CODEC=y
# CONFIG_AUDIO_BT_AUDIO is not set

# SDK v2.5.1 example/ble/peripheral and middleware/bluetooth/Kconfig.
# Peripheral connection probe, with SDK NVDS storage; no classic profiles.
CONFIG_BLUETOOTH=y
CONFIG_BSP_BLE_SIBLES=y
CONFIG_BSP_BLE_CONNECTION_MANAGER=y
CONFIG_BSP_BLE_NVDS_SYNC=y
CONFIG_PKG_USING_FLASHDB=y
# CONFIG_BLE_GAP_CENTRAL is not set
# SDK GATT client reads native iPhone CTS; GAP peripheral role stays unchanged.
CONFIG_BLE_GATT_CLIENT=y
# CONFIG_BLE_CTKD_ENABLE is not set
# CONFIG_BT_RF_TEST is not set
CONFIG_BT_PROFILE_CUSTOMIZE=y

# SDK bt_log_output is silent without ULOG. Keep BLE roles unchanged while
# collecting startup diagnostics (same log setup as peripheral_lab).
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
# CONFIG_ULOG_USING_COLOR is not set

# SDK external/lvgl_v9/Kconfig: decode lossless compressed scene arrays.
CONFIG_LV_USE_LZ4=y
CONFIG_LV_USE_LZ4_INTERNAL=y
CONFIG_LV_BIN_DECODER_RAM_LOAD=y

# SDK LVGL RT-Thread backend: keep image decode buffers out of the system heap.
CONFIG_LV_RTTHREAD_USE_PSRAM_PRIVATE_HEAP=y
CONFIG_LV_RTTHREAD_PSRAM_HEAP_SIZE_KILOBYTES=4096
# SDK LVGL Kconfig: reuse decoded pictures instead of decompressing each refresh.
CONFIG_LV_CACHE_DEF_SIZE=2097152
CONFIG_LV_IMAGE_HEADER_CACHE_DEF_CNT=64


# PAN/HID and DHCP/DNS follow the v2.5.1 peripheral_lab board test.
CONFIG_RT_USING_BLUETOOTH=y
# SDK v2.5.1 classic connection manager and BT_FINSH_PAN require BT_FINSH.
CONFIG_BT_FINSH=y
CONFIG_BSP_BT_CONNECTION_MANAGER=y
CONFIG_BT_USING_PAIRING_CONFIRMATION=y
CONFIG_CFG_PAN=y
CONFIG_CFG_HID=y
# CONFIG_CFG_AV_SNK is not set
# CONFIG_CFG_AV_SRC is not set
# CONFIG_CFG_AVRCP is not set
# CONFIG_CFG_HFP_HF is not set
# CONFIG_CFG_HFP_AG is not set
# CONFIG_BT_AUTO_CONNECT_LAST_DEVICE is not set
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_DHCP=y
CONFIG_RT_LWIP_DNS=y
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
# Xiaozhi HTTPS discovery and verified WSS use the SDK TLS client.
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_PKG_USING_MBEDTLS_USE_ALL_CERTS=y
# CONFIG_PKG_USING_MBEDTLS_TLS_CLIENT_CONNECT_FALLBACK_ALIAS is not set
CONFIG_PKG_USING_CJSON=y
CONFIG_PKG_LIB_OPUS=y
